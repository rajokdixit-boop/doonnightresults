<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOON NIGHT - RESULT | Daily 1 PM</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #8B0000, #FFD700, #B22222);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: rgba(0,0,0,0.85);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .current-section {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 25px;
            border-bottom: 2px solid rgba(255,215,0,0.3);
        }
        .RESULT {
            font-size: 5.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 15px 0;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { filter: drop-shadow(0 0 10px #FFD700); }
            to { filter: drop-shadow(0 0 20px #FFD700); }
        }
        .astrology-text { 
            font-size: 1.2rem; 
            margin: 5px 0; 
            opacity: 0.95; 
            font-weight: 600;
        }

        /* HISTORY CHART TABLE STYLES */
        .history-section {
            margin-top: 30px;
        }
        .history-title {
            font-size: 2rem;
            margin-bottom: 20px;
            text-align: center;
            color: #FFD700;
            font-weight: 700;
            padding: 12px;
            background: rgba(255,215,0,0.1);
            border-radius: 12px;
            border: 2px solid rgba(255,215,0,0.3);
        }
        .table-container {
            width: 100%;
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid rgba(255,215,0,0.3);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }
        .result-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            min-width: 850px;
            background: rgba(15, 15, 15, 0.9);
        }
        .result-table th, .result-table td {
            padding: 10px 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 0.95rem;
        }
        .result-table th {
            background: linear-gradient(180deg, #333333, #111111);
            color: #FFD700;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
        }
        .result-table th.date-col, .result-table td.date-cell {
            background: rgba(255, 215, 0, 0.15);
            color: #FFD700;
            font-weight: 700;
            width: 60px;
        }
        .result-table tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.03);
        }
        .result-table tr:hover {
            background: rgba(255, 215, 0, 0.1);
        }
        .res-val {
            font-weight: 700;
            color: #ffffff;
            font-size: 1.05rem;
        }
        .res-active-cell {
            background: rgba(255, 215, 0, 0.35) !important;
            border: 2px solid #FFD700 !important;
            box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.8);
        }
        .res-active-cell .res-val {
            color: #FFD700;
            font-size: 1.2rem;
            text-shadow: 0 0 5px #FFD700;
        }

        .update-info {
            text-align: center;
            margin-top: 35px;
            padding-top: 20px;
            border-top: 2px solid rgba(255,255,255,0.2);
            font-size: 0.95rem;
            opacity: 0.9;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .RESULT { font-size: 4rem; }
            .container { padding: 15px; }
            .result-table th, .result-table td { padding: 8px 3px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DOON NIGHT</h1>
        
        <div class="current-section">
            <div class="RESULT" id="currentNum">--</div>
            <p class="astrology-text">✨ TODAY'S RESULT (1 October) ✨</p>
            <p class="astrology-text">RESULT TIME 1:00 PM</p>
        </div>

        <!-- CONSOLIDATED HISTORY CHART TABLE -->
        <div class="history-section">
            <h2 class="history-title">📊 YEAR 2026 RESULTS CHART</h2>
            <div class="table-container">
                <table class="result-table" id="historyTable">
                    <thead>
                        <tr id="tableHeader">
                            <th class="date-col">DATE</th>
                            <!-- Month headers inserted by JS -->
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- 1 to 31 rows inserted by JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="update-info">
            Last Updated: October 1, 2026 1:00 PM IST<br>
            👑 DOON NIGHT | Daily 1 PM Results | Delhi, India
        </div>
    </div>

    <script>
        // Formatter function for 2-digit representation
        function formatResult(val) {
            if (val === undefined || val === null || val === "" || val === "--") return "--";
            return String(val).padStart(2, '0');
        }

        // =========================================================
        // TODAY'S RESULT & ACTIVE MONTH DATA
        // =========================================================
        const TODAY_RESULT = "--"; // Update today's result here

        // OCTOBER 2026 (Active month - Add results day by day)
        const octoberResults = []; 

        // HISTORICAL MONTHS DATA
        const januaryResults   = ["14", "82", "05", "49", "73", "28", "91", "60", "34", "17", "52", "88", "02", "39", "65", "41", "70", "23", "96", "11", "58", "84", "09", "31", "67", "45", "78", "20", "93", "15", "50"];
        const februaryResults  = ["37", "61", "18", "85", "42", "09", "74", "26", "90", "53", "11", "68", "32", "95", "04", "47", "81", "29", "76", "13", "59", "80", "24", "63", "07", "48", "92", "35"];
        const marchResults     = ["12", "23", "21", "15", "17", "20", "38", "45", "90", "45", "22", "91", "03", "97", "30", "30", "33", "32", "52", "89", "90", "10", "07", "86", "88", "82", "66", "40", "60", "12", "55"];
        const aprilResults     = ["33", "62", "22", "26", "68", "74", "42", "45", "38", "38", "67", "62", "63", "54", "15", "16", "51", "55", "25", "80", "08", "22", "26", "52", "55", "56", "47", "49", "51"];
        const mayResults       = ["16", "66", "24", "23", "30", "59", "41", "77", "14", "74", "10", "80", "10", "13", "31", "32", "72", "73", "73", "24", "44", "06", "60", "77", "76", "88", "08", "45", "90", "91"];
        const juneResults      = ["93", "36", "14", "13", "63", "11", "44", "66", "10", "10", "51", "38", "20", "40", "04", "13", "70", "57", "58", "75", "07", "97", "22", "88", "19", "62", "26", "25", "25", "00"];
        const julyResults      = ["16", "17", "27", "94", "50", "45", "95", "26", "95", "05", "50", "35", "12", "88", "99", "16", "23", "32", "16", "73", "61", "35", "20", "08", "75", "02", "72", "07", "16", "61"];
        const augustResults    = ["01", "02", "03", "44", "94", "49", "43", "24", "76", "19", "48", "32", "97", "03", "80", "30", "31", "92", "07", "17", "40", "85", "86", "14", "38", "57", "12", "30", "92", "87"];
        const septemberResults = ["52", "55", "07", "07", "08", "99", "10", "24", "44", "99", "04", "38", "40", "40", "41", "15", "94", "06", "83", "71", "63", "33", "93", "01", "77", "27", "26", "29", "66", "--"];

        // Set top main result
        document.getElementById('currentNum').textContent = TODAY_RESULT;

        // Month Columns configuration (Jan to Oct)
        const monthsList = [
            { name: "JAN", data: januaryResults, totalDays: 31 },
            { name: "FEB", data: februaryResults, totalDays: 28 },
            { name: "MAR", data: marchResults, totalDays: 31 },
            { name: "APR", data: aprilResults, totalDays: 30 },
            { name: "MAY", data: mayResults, totalDays: 31 },
            { name: "JUN", data: juneResults, totalDays: 30 },
            { name: "JUL", data: julyResults, totalDays: 31 },
            { name: "AUG", data: augustResults, totalDays: 31 },
            { name: "SEP", data: septemberResults, totalDays: 30 },
            { name: "OCT", data: octoberResults, totalDays: 31, isActive: true }
        ];

        // 1. Build Table Headers
        const headerRow = document.getElementById('tableHeader');
        monthsList.forEach(m => {
            const th = document.createElement('th');
            th.textContent = m.name;
            headerRow.appendChild(th);
        });

        // 2. Build Table Rows for Days 1 to 31
        const tableBody = document.getElementById('tableBody');

        for (let day = 1; day <= 31; day++) {
            const tr = document.createElement('tr');
            
            // Date Cell
            const dateTd = document.createElement('td');
            dateTd.className = 'date-cell';
            dateTd.textContent = String(day).padStart(2, '0');
            tr.appendChild(dateTd);

            // Month Results Cells
            monthsList.forEach(m => {
                const td = document.createElement('td');
                
                if (day <= m.totalDays) {
                    const val = m.data[day - 1];
                    const formatted = formatResult(val);
                    
                    // Highlight active month's latest entry
                    if (m.isActive && day === m.data.length && m.data.length > 0) {
                        td.className = 'res-active-cell';
                    }

                    td.innerHTML = `<span class="res-val">${formatted}</span>`;
                } else {
                    // Days that don't exist in shorter months (e.g., Feb 29-31, Apr 31)
                    td.innerHTML = `<span style="opacity: 0.2;">-</span>`;
                }
                
                tr.appendChild(td);
            });

            tableBody.appendChild(tr);
        }
    </script>
</body>
</html>
