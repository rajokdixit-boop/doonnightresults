<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOON NIGHT - RESULT | Daily 1 PM</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #8B0000, #FFD700, #B22222);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(0,0,0,0.8);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 700;
            background: linear-gradient(45deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .current-section {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 2px solid rgba(255,255,0.3);
        }
        .RESULT {
            font-size: 6rem;
            font-weight: 600;
            background: linear-gradient(45deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 20px 0;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { filter: drop-shadow(0 0 10px #FFD700); }
            to { filter: drop-shadow(0 0 20px #FFD700); }
        }
        .astrology-text { 
            font-size: 1.2rem; 
            margin: 10px 0; 
            opacity: 0.9; 
            font-weight: 600;
        }
        .month-section {
            margin: 40px 0;
        }
        .month-title {
            font-size: 2.2rem;
            margin-bottom: 25px;
            text-align: center;
            color: #FFD700;
            font-weight: 700;
            padding: 15px;
            background: rgba(255,215,0,0.1);
            border-radius: 15px;
            border: 2px solid rgba(255,255,255,0.2);
        }
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }
        .chart-day {
            background: rgba(255,255,255,0.1);
            padding: 12px 8px;
            border-radius: 12px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .chart-day:hover {
            background: rgba(255,215,0,0.2);
            transform: scale(1.05);
            border-color: #FFD700;
        }
        .today-highlight {
            border: 3px solid #FFD700 !important;
            box-shadow: 0 0 20px rgba(255,215,0,0.5);
            background: rgba(255,215,0,0.3) !important;
        }
        .day-date { 
            font-size: 0.85rem; 
            font-weight: 600; 
            margin-bottom: 6px; 
            opacity: 0.95;
        }
        .day-result { 
            font-size: 1.5rem; 
            font-weight: 700; 
            color: #FFD700;
            background: rgba(255,215,0,0.2);
            padding: 6px 8px;
            border-radius: 8px;
            line-height: 1.1;
        }
        .update-info {
            text-align: center;
            margin-top: 40px;
            padding-top: 25px;
            border-top: 2px solid rgba(255,255,255,0.3);
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 600;
        }
        @media (max-width: 480px) {
            h1 { font-size: 3rem; }
            .RESULT { font-size: 4rem; }
            .container { padding: 20px; }
            .chart-grid { 
                grid-template-columns: repeat(4, 1fr); 
                gap: 8px; 
            }
            .day-result { font-size: 1.3rem; padding: 4px 6px; }
            .day-date { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DOON NIGHT</h1>
        
        <!-- CURRENT RESULT -->
        <div class="current-section">
            <div class="RESULT" id="currentNum">22</div>
            <p class="astrology-text">✨ TODAY'S RESULT (23 June) ✨</p>
            <p class="astrology-text">RESULT TIME 1:00 PM</p>
        </div>

        <!-- JUNE 2026 RESULTS -->
        <div class="month-section">
            <h2 class="month-title">📊 JUNE 2026 RESULTS (Active)</h2>
            <div class="chart-grid" id="juneChart"></div>
        </div>

        <!-- MAY 2026 RESULTS -->
        <div class="month-section">
            <h2 class="month-title">📊 MAY 2026 RESULTS (Complete)</h2>
            <div class="chart-grid" id="mayChart"></div>
        </div>

        <!-- APRIL 2026 RESULTS -->
        <div class="month-section">
            <h2 class="month-title">📊 APRIL 2026 RESULTS (Complete)</h2>
            <div class="chart-grid" id="aprilChart"></div>
        </div>

        <!-- MARCH 2026 RESULTS -->
        <div class="month-section">
            <h2 class="month-title">📊 MARCH 2026 RESULTS (Complete)</h2>
            <div class="chart-grid" id="marchChart"></div>
        </div>

        <div class="update-info">
            Last Updated: June 23, 2026 1:00 PM IST<br>
            👑 DOON NIGHT | Daily 1 PM Results | Delhi, India
        </div>
    </div>

    <script>
        // UPDATE THIS DAILY FOR JUNE
        const TODAY_RESULT = "22"; // Example initial value for June 1st

        // JUNE 2026 (Active month - Add numbers as they come)
        const juneResults = [ 93, 36, 14, 13, 63, 11, 44, 66, 10, 10, 51, 38, 20, 40, 04, 13, 70, 57, 58, 75, 07, 97, 22 ];

        // MAY 2026 (Saved Complete Data)
        const mayResults = [ 16, 66, 24, 23, 30, 59, 41, 77, 14, 74, 10, 80, 10, 13, 31, 32, 72, 73, 73, 24, 44, 06, 60, 77, 76, 88, 08, 45, 90, 91 ];

        // APRIL 2026 (Saved Complete Data)
        const aprilResults = [
           33, 62, 22, 26, 68, 74, 42, 45, 38, 38, 67, 62, 63, 54, 15, 16, 51, 55, 25, 80, 08, 22, 26, 52, 55, 56, 47, 49, 51
        ];

        // MARCH 2026 (Saved Complete Data)
        const marchResults = [
            12, 23, 21, 15, 17, 20, 38, 45, 90, 45, 22, 91, 03, 97, 30, 30, 33, 32, 52, 89, 90, 10, 07, 86, 88, 82, 66, 40, 60, 12, 55
        ];

        document.getElementById('currentNum').textContent = TODAY_RESULT;

        // Function to populate complete historical charts
        function populateChart(elementId, results, monthLabel) {
            const container = document.getElementById(elementId);
            results.forEach((res, i) => {
                const div = document.createElement('div');
                div.className = 'chart-day';
                div.innerHTML = `<div class="day-date">${i+1} ${monthLabel}</div><div class="day-result">${res}</div>`;
                container.appendChild(div);
            });
        }

        // Active handling for June (Active month loops up to 30 days)
        const juneChart = document.getElementById('juneChart');
        for(let day = 1; day <= 30; day++) {
            const div = document.createElement('div');
            const result = juneResults[day-1] !== undefined ? juneResults[day-1] : "--";
            if(day === juneResults.length && juneResults.length > 0) div.className = 'chart-day today-highlight';
            else div.className = 'chart-day';
            div.innerHTML = `<div class="day-date">${day} June</div><div class="day-result">${result}</div>`;
            juneChart.appendChild(div);
        }

        // Render previous months
        populateChart('mayChart', mayResults, 'May');
        populateChart('aprilChart', aprilResults, 'Apr');
        populateChart('marchChart', marchResults, 'Mar');
    </script>
</body>
</html>
